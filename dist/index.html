<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HajzerStudio | Beauty niche websites that turn visits into bookings</title>
    <meta
      name="description"
      content="HajzerStudio builds premium, conversion-focused websites for beauty brands, salons and barber shops that need more bookings and a stronger first impression."
    />
    <meta
      property="og:title"
      content="HajzerStudio | Premium websites for beauty businesses"
    />
    <meta
      property="og:description"
      content="Portfolio and live demos for premium salon, barber and beauty websites built to close more bookings."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/assets/HajzerStudioBG-D_-UV9ls.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/assets/main-C-UaBSpK.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/ScrollTrigger-CJa91OC3.js">
    <link rel="stylesheet" crossorigin href="/assets/main-DEqyAYZD.css">
  </head>
  <body>
    <div class="page-noise" aria-hidden="true"></div>
    <div class="ambient ambient-a" aria-hidden="true"></div>
    <div class="ambient ambient-b" aria-hidden="true"></div>

    <header class="site-header">
      <a href="#top" class="brand" aria-label="HajzerStudio home">
        <span class="brand-badge">
          <img src="/assets/HajzerStudioNoBG-BNGmHxsS.png" alt="HajzerStudio logo" class="brand-logo" />
        </span>
        <span class="brand-copy">
          <strong>HajzerStudio</strong>
          <span id="brandSubline">Beauty niche web systems</span>
        </span>
      </a>

      <button
        id="menuBtn"
        class="menu-btn"
        type="button"
        aria-expanded="false"
        aria-controls="mainNav"
      >
        Menu
      </button>

      <nav id="mainNav" class="main-nav" aria-label="Primary navigation">
        <a href="#demos" id="navDemos"></a>
        <a href="#outcomes" id="navOutcomes"></a>
        <a href="#system" id="navSystem"></a>
        <a href="#faq" id="navFaq"></a>
        <a href="#contact" id="navContact"></a>
      </nav>

      <div class="lang-switch" role="group" aria-label="Language switch">
        <button class="lang-btn" type="button" data-lang="hu">HU</button>
        <button class="lang-btn" type="button" data-lang="en">EN</button>
      </div>
    </header>

    <main id="top" data-ts-ready="pending">
      <section class="hero" id="hero">
        <div class="hero-copy">
          <p class="eyebrow" id="heroEyebrow"></p>
          <h1 class="hero-title" id="heroTitle"></h1>
          <p class="hero-lead" id="heroLead"></p>

          <div class="hero-actions">
            <a href="#demos" class="btn btn-primary" id="heroPrimaryCta"></a>
            <a href="#contact" class="btn btn-secondary" id="heroSecondaryCta"></a>
          </div>

          <div class="hero-points" id="heroPoints"></div>

          <div class="hero-metrics" id="heroMetrics"></div>
        </div>

        <aside class="hero-panel">
          <div class="hero-panel-top">
            <p class="eyebrow" id="offerEyebrow"></p>
            <h2 id="offerTitle"></h2>
            <p id="offerLead"></p>
          </div>

          <div class="offer-stack" id="offerStack"></div>

          <div class="offer-proof">
            <article>
              <span id="proofStatAValue"></span>
              <p id="proofStatALabel"></p>
            </article>
            <article>
              <span id="proofStatBValue"></span>
              <p id="proofStatBLabel"></p>
            </article>
          </div>
        </aside>
      </section>

      <section class="section section-grid" id="demos">
        <div class="section-head reveal">
          <p class="eyebrow" id="demosEyebrow"></p>
          <h2 id="demosTitle"></h2>
          <p class="section-lead" id="demosLead"></p>
        </div>
        <div class="demo-grid" id="demoGrid"></div>
      </section>

      <section class="section section-grid" id="outcomes">
        <div class="section-head reveal">
          <p class="eyebrow" id="outcomesEyebrow"></p>
          <h2 id="outcomesTitle"></h2>
          <p class="section-lead" id="outcomesLead"></p>
        </div>
        <div class="value-grid" id="valueGrid"></div>
      </section>

      <section class="section calculator-section" id="calculator">
        <div class="section-head reveal">
          <p class="eyebrow" id="calculatorEyebrow"></p>
          <h2 id="calculatorTitle"></h2>
          <p class="section-lead" id="calculatorLead"></p>
        </div>

        <div class="calculator-shell reveal">
          <div class="calculator-form">
            <label>
              <span id="labelVisits"></span>
              <input id="inputVisits" type="range" min="200" max="6000" step="100" value="1400" />
              <output id="outputVisits"></output>
            </label>
            <label>
              <span id="labelConversion"></span>
              <input id="inputConversion" type="range" min="1" max="20" step="1" value="5" />
              <output id="outputConversion"></output>
            </label>
            <label>
              <span id="labelTicket"></span>
              <input id="inputTicket" type="range" min="8000" max="60000" step="1000" value="18000" />
              <output id="outputTicket"></output>
            </label>
            <label>
              <span id="labelUplift"></span>
              <input id="inputUplift" type="range" min="10" max="120" step="5" value="35" />
              <output id="outputUplift"></output>
            </label>
          </div>

          <aside class="calculator-results">
            <p class="eyebrow" id="calculatorResultEyebrow"></p>
            <div class="result-tile">
              <span id="resultExtraBookings"></span>
              <p id="resultExtraBookingsLabel"></p>
            </div>
            <div class="result-tile result-tile-accent">
              <span id="resultExtraRevenue"></span>
              <p id="resultExtraRevenueLabel"></p>
            </div>
            <p class="result-note" id="calculatorNote"></p>
          </aside>
        </div>
      </section>

      <section class="section process-section" id="system">
        <div class="section-head reveal">
          <p class="eyebrow" id="systemEyebrow"></p>
          <h2 id="systemTitle"></h2>
          <p class="section-lead" id="systemLead"></p>
        </div>

        <div class="process-layout">
          <aside class="process-panel reveal">
            <p class="eyebrow" id="processPanelEyebrow"></p>
            <p class="process-stage" id="processStage"></p>
            <h3 id="processPanelTitle"></h3>
            <p class="process-panel-copy" id="processPanelCopy"></p>
            <ul class="process-bullets" id="processBullets"></ul>
          </aside>

          <div class="process-steps" id="processSteps"></div>
        </div>
      </section>

      <section class="section brief-section" id="brief">
        <div class="section-head reveal">
          <p class="eyebrow" id="briefEyebrow"></p>
          <h2 id="briefTitle"></h2>
          <p class="section-lead" id="briefLead"></p>
        </div>

        <div class="brief-layout">
          <div class="challenge-picker reveal">
            <div class="challenge-list" id="challengeList"></div>
          </div>

          <aside class="brief-panel reveal">
            <p class="eyebrow" id="briefPanelEyebrow"></p>
            <h3 id="briefPanelTitle"></h3>
            <p id="briefPanelLead"></p>
            <div class="brief-tags" id="briefTags"></div>
            <div class="brief-recommendations" id="briefRecommendations"></div>
          </aside>
        </div>
      </section>

      <section class="section faq-section" id="faq">
        <div class="section-head reveal">
          <p class="eyebrow" id="faqEyebrow"></p>
          <h2 id="faqTitle"></h2>
          <p class="section-lead" id="faqLead"></p>
        </div>
        <div class="faq-grid" id="faqGrid"></div>
      </section>

      <section class="section contact-section" id="contact">
        <div class="contact-layout">
          <div class="contact-copy reveal">
            <p class="eyebrow" id="contactEyebrow"></p>
            <h2 id="contactTitle"></h2>
            <p class="section-lead" id="contactLead"></p>

            <div class="contact-links">
              <a href="mailto:hello@hajzerstudio.hu" id="contactEmail">hello@hajzerstudio.hu</a>
              <a href="tel:+36301234567" id="contactPhone">+36 30 123 4567</a>
              <a
                href="https://wa.me/36301234567?text=Hello%20HajzerStudio%2C%20I%20would%20like%20a%20website%20concept."
                target="_blank"
                rel="noreferrer"
                id="contactWhatsapp"
              >
                WhatsApp
              </a>
            </div>

            <div class="contact-note" id="contactNote"></div>
          </div>

          <form class="contact-form reveal" id="contactForm" action="#" method="post">
            <label>
              <span id="labelName"></span>
              <input id="fieldName" name="name" type="text" autocomplete="name" />
            </label>
            <label>
              <span id="labelBusiness"></span>
              <input id="fieldBusiness" name="business" type="text" autocomplete="organization" />
            </label>
            <label>
              <span id="labelNiche"></span>
              <select id="fieldNiche" name="niche">
                <option value="barber">Barber</option>
                <option value="salon">Salon</option>
                <option value="beauty">Beauty studio</option>
              </select>
            </label>
            <label>
              <span id="labelTiming"></span>
              <select id="fieldTiming" name="timing">
                <option value="1-2 weeks">1-2 weeks</option>
                <option value="this month">This month</option>
                <option value="planning">Planning phase</option>
              </select>
            </label>
            <label class="field-wide">
              <span id="labelMessage"></span>
              <textarea id="fieldMessage" name="message" rows="5"></textarea>
            </label>

            <div class="form-actions">
              <button type="submit" class="btn btn-primary" id="submitBrief"></button>
              <button type="button" class="btn btn-secondary" id="copyBrief"></button>
            </div>
          </form>
        </div>

        <aside class="brief-preview reveal">
          <p class="eyebrow" id="previewEyebrow"></p>
          <h3 id="previewTitle"></h3>
          <pre id="briefPreview"></pre>
        </aside>
      </section>
    </main>

    <footer class="site-footer">
      <p id="footerCopy"></p>
    </footer>

    <a href="#contact" class="floating-cta" id="floatingCta"></a>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "HajzerStudio",
        "description": "Premium websites for beauty businesses, salons and barber shops.",
        "areaServed": "Hungary",
        "email": "hello@hajzerstudio.hu",
        "telephone": "+36301234567",
        "url": "https://hajzerstudio.hu"
      }
    </script>
  </body>
</html>
